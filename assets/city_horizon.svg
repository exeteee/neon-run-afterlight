  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0cb8f4"/><stop offset="1" stop-color="#73f9ff"/>
  </linearGradient>
  <radialGradient id="moon">
    <stop offset="0" stop-color="#f2fbff"/><stop offset="0.78" stop-color="#b9ddff"/><stop offset="1" stop-color="#8db8f0"/>
  </radialGradient>
</defs>
