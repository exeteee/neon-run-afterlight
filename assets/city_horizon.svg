  </linearGradient>
  <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#06bfe9" stop-opacity="0.08"/><stop offset="0.5" stop-color="#6b83ff" stop-opacity="0.45"/><stop offset="1" stop-color="#ee3bc5" stop-opacity="0.16"/>
