name: Build NEON RUN Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NEON_RUN_AFTERLIGHT_source.zip'
      - '.github/workflows/android-build.yml'
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'assets/**'
      - 'audio/**'

permissions:
  contents: write

concurrency:
  group: neon-run-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and export APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unpack the submitted project once
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f project.godot ]]; then
            mkdir -p "$RUNNER_TEMP/neon-source"
            unzip -q NEON_RUN_AFTERLIGHT_source.zip -d "$RUNNER_TEMP/neon-source"
            test -f "$RUNNER_TEMP/neon-source/NEON_RUN_AFTERLIGHT/project.godot"
            rsync -a --exclude='.github/' "$RUNNER_TEMP/neon-source/NEON_RUN_AFTERLIGHT/" ./
            git add -A
            git reset -- NEON_RUN_AFTERLIGHT_source.zip || true
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add extracted NEON RUN Godot project"
              git push origin "HEAD:$GITHUB_REF_NAME"
            fi
          else
            echo 'Source already extracted; preserve all committed project changes.'
          fi

      - name: Set up Python for project checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run project integrity tests
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python -m unittest discover -s tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android build packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.1" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot 4.7.2 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -L --fail --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          sudo install -m 0755 "$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" /usr/local/bin/godot
          godot --version
          curl -L --fail --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/godot-templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$TEMPLATE_DIR"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$TEMPLATE_DIR/"
          printf '4.7.2.stable' > "$TEMPLATE_DIR/version.txt"

      - name: Configure Android debug signing and Godot paths
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2

      - name: Import Godot project resources and reject script errors
        shell: bash
        run: |
          set -o pipefail
          godot --headless --editor --path . --import 2>&1 | tee "$RUNNER_TEMP/godot-import.log"
          if grep -E 'SCRIPT ERROR:|Failed to load script|Parse Error:|ERROR: Cannot export' "$RUNNER_TEMP/godot-import.log"; then
            echo 'Godot import reported a project error.' >&2
            exit 1
          fi

      - name: Launch the game headlessly for a startup smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee "$RUNNER_TEMP/godot-startup.log"
          if grep -E 'SCRIPT ERROR:|Failed to load script|Parse Error:|ERROR:' "$RUNNER_TEMP/godot-startup.log"; then
            echo 'Godot startup reported a project error.' >&2
            exit 1
          fi

      - name: Test full-screen touch gestures in Godot
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://tests/test_touch_input.gd 2>&1 | tee "$RUNNER_TEMP/godot-touch.log"
          if grep -E 'SCRIPT ERROR:|Failed to load script|Parse Error:|ERROR:' "$RUNNER_TEMP/godot-touch.log"; then
            echo 'Touch input integration test reported a Godot error.' >&2
            exit 1
          fi

      - name: Export signed debug APK
        shell: bash
        run: |
          set -euo pipefail
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          ./scripts/build_android.sh

      - name: Verify APK signature and alignment
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS="$SDK_ROOT/build-tools/35.0.1"
          APK="build/NEON_RUN_AFTERLIGHT.apk"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/zipalign"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"

      - name: Verify APK package
        shell: bash
        run: |
          set -euo pipefail
          test -s build/NEON_RUN_AFTERLIGHT.apk
          python - <<'PY'
          import zipfile
          from pathlib import Path
          apk = Path("build/NEON_RUN_AFTERLIGHT.apk")
          with zipfile.ZipFile(apk) as archive:
              names = set(archive.namelist())
              assert "AndroidManifest.xml" in names, "APK has no AndroidManifest.xml"
              assert any(name.startswith("lib/arm64-v8a/") for name in names), "APK has no arm64-v8a native library"
          print(f"APK verified: {apk.stat().st_size:,} bytes")
          PY

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-RUN-AFTERLIGHT-APK
          path: build/NEON_RUN_AFTERLIGHT.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: 'NEON RUN: AFTERLIGHT — Android build ${{ github.run_number }}'
          body: |
            Automated debug APK build for direct Android installation.
            Built with Godot 4.7.2. This is a sideload/debug build, not a Google Play release.
          files: build/NEON_RUN_AFTERLIGHT.apk
          make_latest: true

# Workflow version: 2 — quote YAML release title and ensure the first push is scheduled.
